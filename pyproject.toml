[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "infra-artifact-ledger"
version = "0.1.0a1"
description = "Independent local artifact identity, version, content and provenance ledger"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "kongbu0621"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: POSIX :: Linux",
]

[project.scripts]
artifact-ledger = "infra_artifact_ledger.cli:main"

[project.urls]
Repository = "https://github.com/kongbu0621/infra-artifact-ledger"

[tool.setuptools.packages.find]
where = ["src"]
